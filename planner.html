<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Planner - Ifeanyi Chima Portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <style>
    .task-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.75rem 1rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        margin-bottom: 0.75rem;
        background: #fff;
        transition: all 0.2s ease;
    }
    /* This rule correctly applies the strike-through when task-item has the 'completed' class */
    .task-item.completed {
        background-color: #f1f5f9;
    }
    .task-item.completed span {
        text-decoration: line-through;
        color: var(--text-muted);
    }
</style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">Ifeanyi Chima</div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Me</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="planner.html" class="active">Academic Planner</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Interactive Academic Planner</h2>
            <p>Manage your computer science labs, coursework, and study schedule efficiently.</p>

            <div style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem;">
                <input type="text" id="taskInput" placeholder="Enter new academic task..." style="margin-bottom: 0;">
                <button id="addTaskBtn">Add Task</button>
            </div>

            <div id="taskList">
                <!-- Dynamic tasks will populate here -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Ifeanyi Chima. All Rights Reserved.</p>
    </footer>

    <script>
        document.getElementById('addTaskBtn').addEventListener('click', function() {
            const input = document.getElementById('taskInput');
            const taskText = input.value.trim();

            if (taskText === '') {
                alert('Please enter a valid task.');
                return;
            }

            const taskList = document.getElementById('taskList');

            const taskItem = document.createElement('div');
            taskItem.className = 'task-item';

            const span = document.createElement('span');
            span.textContent = taskText;

            const btnGroup = document.createElement('div');
            btnGroup.style.display = 'flex';
            btnGroup.style.gap = '0.5rem';

            const completeBtn = document.createElement('button');
            completeBtn.textContent = 'Complete';
            completeBtn.style.backgroundColor = 'var(--success)';
            completeBtn.style.padding = '0.4rem 0.8rem';
            completeBtn.onclick = function() {
                taskItem.classList.toggle('completed');
            };

            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = 'Delete';
            deleteBtn.style.backgroundColor = 'var(--danger)';
            deleteBtn.style.padding = '0.4rem 0.8rem';
            deleteBtn.onclick = function() {
                taskList.removeChild(taskItem);
            };

            btnGroup.appendChild(completeBtn);
            btnGroup.appendChild(deleteBtn);

            taskItem.appendChild(span);
            taskItem.appendChild(btnGroup);

            taskList.appendChild(taskItem);

            input.value = '';
        });
    </script>
</body>
</html>
